name: Python Pipeline CI

# 1. TRIGGER: Automatische CI für Feature-Branches, develop und Merge Requests
on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Nutzt deine Anforderungen aus dem Projekt
        pip install pandas geopandas pytest pyarrow fastparquet flake8 black

    # 2. STATISCHE CODE ANALYSE (Linting)
    - name: Lint with black & flake8
      run: |
        # Black prüft das Format, flake8 die Logik-Struktur
        black --check .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 3. UNIT TESTS
    - name: Run Unit Tests with pytest
      env:
        PYTHONPATH: ${{ github.workspace }}/Python
      run: |
        pytest tests/ -v

    # 4. NOTIFICATIONS (Status-Update)
    # GitHub Actions schickt standardmäßig E-Mails bei Fehlern an dich.
    # Um es explizit zu machen, nutzen wir einen Step, der am Ende zusammenfasst.
    - name: Pipeline Status Notification
      if: always() # Wird immer ausgeführt, egal ob Erfolg oder Fehler
      run: |
        echo "Pipeline-Status: ${{ job.status }}"