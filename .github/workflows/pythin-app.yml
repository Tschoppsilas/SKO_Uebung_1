name: Python Pipeline CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Hier werden nur die nötigsten Pakete installiert
        pip install pandas geopandas pytest pyarrow fastparquet

    - name: Lint with flake8
      run: |
        pip install flake8
        # Zeigt Fehler an, bricht aber nicht ab
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests
      env:
        # Erklärt dem GitHub-Server, wo deine pipeline.py liegt
        PYTHONPATH: ${{ github.workspace }}/Python
      run: |
        pytest tests/